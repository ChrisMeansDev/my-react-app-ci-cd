version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd react-app
      - npm install
  build:
    commands:
      - npm test -- --coverage
  post_build:
    commands:
      - echo "Build completed"

artifacts:
  base-directory: react-app/build
  files:
    - '**/*'

